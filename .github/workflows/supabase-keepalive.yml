name: Keep Supabase project active

# Supabase pauses a free-tier project after ~7 days with zero API activity
# (docs: https://supabase.com/docs/guides/platform/free-project-pausing).
# Any request counts, so a bare REST ping every 3 days is enough margin to
# never hit that window, without needing anyone to remember to log in.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          # PostgREST wants both headers, not just apikey -- an apikey-only
          # request against the new sb_publishable_* key format came back
          # 401 when this was first tested live, not the clean 200 a real
          # client (which sends both) gets. Targets cartridge_popularity
          # specifically -- a real table read, not just the API root --
          # since that's the exact anon-readable view schema.sql grants,
          # so a regression in those grants would fail this too, not just
          # silently report success while touching nothing real.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/cartridge_popularity?select=cartridge&limit=1")
          echo "Response status: $status"
          case "$status" in
            2??) ;;
            *) echo "Expected a 2xx response, got $status."; exit 1 ;;
          esac
